<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="blade_energy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0077c2" />
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff00" />
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Espada de plasma / báculo cibernético en mano derecha -->
  <!-- Empuñadura -->
  <rect x="92" y="72" width="6" height="24" rx="2" fill="#37474f" stroke="#78909c" stroke-width="1.2" />
  <circle cx="95" cy="98" r="3" fill="#ffd54f" />
  <polygon points="90,72 100,72 95,68" fill="#546e7a" />

  <!-- Hoja de energía de plasma vertical hacia arriba -->
  <polygon points="95,16 99,66 91,66" fill="url(#blade_energy)" stroke="#80d8ff" stroke-width="1.5" />
  <line x1="95" y1="20" x2="95" y2="64" stroke="#ffffff" stroke-width="1.2" />
  <circle cx="95" cy="18" r="4" fill="url(#sparkle)" />

  <!-- Guantelete izquierdo cibernético con escudo emisor -->
  <rect x="22" y="74" width="12" height="14" rx="3" fill="#01579b" stroke="#00e5ff" stroke-width="1.5" />
  <ellipse cx="28" cy="81" rx="4" ry="7" fill="#00e5ff" opacity="0.8" />
</svg>
