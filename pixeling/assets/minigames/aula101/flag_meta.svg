<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brillo verde neón META -->
    <radialGradient id="meta_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura circular de llegada -->
  <circle cx="32" cy="32" r="26" fill="url(#meta_glow)" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="4,3" />

  <!-- Asta de bandera cibernética -->
  <line x1="22" y1="12" x2="22" y2="52" stroke="#b0bec5" stroke-width="3" stroke-linecap="round" />
  <circle cx="22" cy="12" r="3.5" fill="#ffd54f" />

  <!-- Banderín con texto META -->
  <polygon points="23,14 48,24 23,34" fill="#00e676" stroke="#00c853" stroke-width="1.5" />
  <polygon points="25,18 43,24 25,30" fill="#69f0ae" />

  <!-- Base de llegada tecnológica -->
  <ellipse cx="28" cy="50" rx="14" ry="4" fill="#1b5e20" stroke="#00e676" stroke-width="1.5" />
</svg>
