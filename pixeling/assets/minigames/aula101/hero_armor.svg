<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <!-- Gradiente Neón Armadura Azul Cibernética -->
    <linearGradient id="armor_plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288d1" />
      <stop offset="50%" stop-color="#01579b" />
      <stop offset="100%" stop-color="#002f6c" />
    </linearGradient>
    <radialGradient id="arc_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0091ea" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hombreras pesadas -->
  <path d="M 28 42 L 42 42 L 40 54 L 26 50 Z" fill="url(#armor_plate)" stroke="#00e5ff" stroke-width="1.8" />
  <path d="M 92 42 L 78 42 L 80 54 L 94 50 Z" fill="url(#armor_plate)" stroke="#00e5ff" stroke-width="1.8" />

  <!-- Coraza de pecho / Pechera de poder -->
  <path d="M 40 44 L 80 44 L 74 78 L 60 84 L 46 78 Z" fill="url(#armor_plate)" stroke="#00e5ff" stroke-width="2" />
  <path d="M 46 48 L 74 48 L 70 70 L 60 76 L 50 70 Z" fill="#001e3d" stroke="#00b0ff" stroke-width="1.2" />

  <!-- Reactor central de energía arcana / cibernética -->
  <circle cx="60" cy="62" r="10" fill="url(#arc_core)" />
  <polygon points="60,56 65,65 55,65" fill="#ffffff" />

  <!-- Cinturón cibernético y grebas -->
  <rect x="46" y="82" width="28" height="6" rx="2" fill="#263238" stroke="#00e5ff" stroke-width="1.2" />
  <circle cx="60" cy="85" r="2.5" fill="#ffd54f" />
</svg>
