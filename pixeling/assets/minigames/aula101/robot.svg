<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente metálico del cuerpo del robot -->
    <linearGradient id="bot_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263238" />
      <stop offset="50%" stop-color="#37474f" />
      <stop offset="100%" stop-color="#1e272c" />
    </linearGradient>
    <!-- Gradiente del visor cyan cyber -->
    <linearGradient id="bot_visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b0ff" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#80d8ff" />
    </linearGradient>
    <!-- Orugas laterales -->
    <linearGradient id="bot_tread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111518" />
      <stop offset="50%" stop-color="#455a64" />
      <stop offset="100%" stop-color="#111518" />
    </linearGradient>
  </defs>

  <!-- Orugas laterales izquierda y derecha -->
  <rect x="6" y="10" width="10" height="44" rx="4" fill="url(#bot_tread)" stroke="#00e5ff" stroke-width="1.2" />
  <line x1="6" y1="20" x2="16" y2="20" stroke="#00e5ff" stroke-width="1" opacity="0.6" />
  <line x1="6" y1="32" x2="16" y2="32" stroke="#00e5ff" stroke-width="1" opacity="0.6" />
  <line x1="6" y1="44" x2="16" y2="44" stroke="#00e5ff" stroke-width="1" opacity="0.6" />

  <rect x="48" y="10" width="10" height="44" rx="4" fill="url(#bot_tread)" stroke="#00e5ff" stroke-width="1.2" />
  <line x1="48" y1="20" x2="58" y2="20" stroke="#00e5ff" stroke-width="1" opacity="0.6" />
  <line x1="48" y1="32" x2="58" y2="32" stroke="#00e5ff" stroke-width="1" opacity="0.6" />
  <line x1="48" y1="44" x2="58" y2="44" stroke="#00e5ff" stroke-width="1" opacity="0.6" />

  <!-- Chasis central -->
  <rect x="14" y="12" width="36" height="40" rx="6" fill="url(#bot_body)" stroke="#78909c" stroke-width="1.5" />

  <!-- Antena emisora superior central apuntando hacia el frente (arriba) -->
  <line x1="32" y1="12" x2="32" y2="4" stroke="#00e5ff" stroke-width="2" />
  <circle cx="32" cy="4" r="3.5" fill="#ffd54f" stroke="#ffb300" stroke-width="1" />

  <!-- Visor Cyber / Pantalla de ojos -->
  <rect x="18" y="18" width="28" height="13" rx="3" fill="#09141f" stroke="#00b0ff" stroke-width="1.2" />
  <!-- Ojos LED luminosos -->
  <rect x="22" y="21" width="7" height="6" rx="1.5" fill="url(#bot_visor)" />
  <rect x="35" y="21" width="7" height="6" rx="1.5" fill="url(#bot_visor)" />
  <circle cx="24" cy="23" r="1" fill="#ffffff" />
  <circle cx="37" cy="23" r="1" fill="#ffffff" />

  <!-- Núcleo de energía / Flecha indicadora frontal en el pecho -->
  <polygon points="32,36 24,46 40,46" fill="#00e5ff" opacity="0.9" />
  <polygon points="32,39 27,45 37,45" fill="#ffffff" />
</svg>
