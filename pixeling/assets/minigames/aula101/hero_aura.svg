<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <radialGradient id="aura_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura mística / cibernética circular -->
  <circle cx="60" cy="65" r="54" fill="url(#aura_glow)" />

  <!-- Círculos rúnicos tecnológicos de validación -->
  <circle cx="60" cy="65" r="48" fill="none" stroke="#ffd54f" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.8" />
  <circle cx="60" cy="65" r="42" fill="none" stroke="#00e5ff" stroke-width="1.0" stroke-dasharray="3,3" opacity="0.9" />

  <!-- Destellos y chispas de poder -->
  <polygon points="60,6 62,12 60,10 58,12" fill="#ffffff" />
  <polygon points="110,65 104,67 106,65 104,63" fill="#ffffff" />
  <polygon points="10,65 16,67 14,65 16,63" fill="#ffffff" />
  <polygon points="60,124 62,118 60,120 58,118" fill="#ffffff" />
</svg>
